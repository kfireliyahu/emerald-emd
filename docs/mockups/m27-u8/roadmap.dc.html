<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roadmap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.em{--bg:#ffffff;--surface:#f7f7f6;--elevated:#ffffff;--ink:#111111;--ink2:#6b6b6b;--ink3:#a0a09c;--hair:#ececea;--hair2:#d9d9d6;--accent:#07805f;--accent-ink:#ffffff;--accent-soft:#e8f6f1;--pop:0 1px 2px rgba(17,17,17,.04),0 8px 24px rgba(17,17,17,.08);--ease:cubic-bezier(.22,1,.36,1);background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background-color 180ms,color 180ms}
.em.dark{--bg:#0b0b0c;--surface:#151517;--elevated:#1b1b1e;--ink:#f2f2f0;--ink2:#a1a1a0;--ink3:#6a6a6c;--hair:#262629;--hair2:#34343a;--accent:#34d399;--accent-ink:#06231a;--accent-soft:#10312a;--pop:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.55)}
.em button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.em button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px}
.label{font-size:11px;line-height:1.3;letter-spacing:.08em;font-weight:500;text-transform:uppercase;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1.3;letter-spacing:.06em;font-weight:500;text-transform:uppercase;padding:3px 8px;border:1px solid var(--hair2);color:var(--ink2);white-space:nowrap;transition:color 180ms,border-color 180ms,background-color 180ms}
.chip.built,.chip.closed{color:var(--ink);background:var(--surface);border-color:var(--hair)}
.chip.in_progress,.chip.open{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.chip.dropped{text-decoration:line-through}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;background:var(--accent)!important;color:var(--accent-ink)!important;font-weight:500!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.22);transition:background-color 120ms,box-shadow 180ms}
.btn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(7,128,95,.24),0 4px 10px rgba(7,128,95,.22)}
.btn.ghost{background:transparent!important;color:var(--ink)!important;border:1px solid var(--hair2);box-shadow:none}
/* the timeline */
.ms{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:16px}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:19px;top:0;bottom:0;border-left:2px solid var(--ink3)}
.rail.dashed::before{border-left-style:dashed;border-left-color:var(--hair2)}
.rail.first::before{top:22px}
.rail.last::before{bottom:auto;height:22px}
.rail.lastdash::before{border-left-style:dashed;border-left-color:var(--hair2)}
.dot{position:absolute;left:11px;top:14px;width:18px;height:18px;border-radius:9999px;box-sizing:border-box;background:var(--bg)!important;border:2px solid var(--hair2)!important;transition:background-color 260ms var(--ease),border-color 260ms var(--ease),transform 260ms var(--ease)}
.dot.closed{background:var(--ink)!important;border-color:var(--ink)!important}
.dot.open{border:2px solid var(--accent)!important;background:var(--accent-soft)!important}
.dot.open::after{content:"";position:absolute;inset:3px;border-radius:9999px;background:var(--accent)}
.dot.open::before{content:"";position:absolute;inset:-7px;border-radius:9999px;border:1px solid var(--accent);opacity:.35}
.head{display:block;width:100%;padding:10px 12px 12px;margin-left:-12px;transition:background-color 120ms}
.head:hover{background:var(--surface)}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows 260ms var(--ease)}
.fold.on{grid-template-rows:1fr}
.fold > div{overflow:hidden;min-height:0}
.chev{display:inline-block;transition:transform 180ms var(--ease);color:var(--ink2)}
.chev.on{transform:rotate(90deg)}
.bar{display:flex;gap:2px;height:6px;width:220px}
.seg{flex:1;background:var(--hair);transition:background-color 260ms var(--ease)}
.seg.built{background:var(--ink)}
.seg.in_progress{background:var(--accent)}
.seg.dropped{background:transparent;border:1px dashed var(--hair2)}
.unit{display:grid;grid-template-columns:18px 76px minmax(0,1fr) auto 60px;align-items:center;column-gap:12px;padding:7px 12px;margin-left:-12px;border-top:1px solid var(--hair);transition:background-color 600ms var(--ease)}
.unit .udot{width:8px;height:8px;border-radius:9999px;border:1.5px solid var(--hair2);box-sizing:border-box;justify-self:center;transition:background-color 260ms,border-color 260ms}
.unit .udot.built{background:var(--ink);border-color:var(--ink)}
.unit .udot.in_progress{background:var(--accent);border-color:var(--accent)}
.unit .udot.dropped{border-style:dashed}
.unit.dropped .utitle{color:var(--ink2);text-decoration:line-through}
.unit.flash{background:var(--accent-soft)}
.pulseA .udot,.pulseB .udot{animation:pulse 900ms var(--ease) 1}
.pulseB .udot{animation-name:pulse2}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 10px transparent}}
@keyframes pulse2{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 10px transparent}}
.claim{grid-column:3 / 6;font-size:12px;color:var(--ink2);padding-top:2px}
.slidein{animation:slidein 260ms var(--ease) 1}
@keyframes slidein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.em *,.em *::before,.em *::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="{{rootClass}}">
<div style="max-width: 1040px; margin: 0 auto; padding: 48px 32px 96px; box-sizing: border-box;">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding-bottom: 24px; border-bottom: 1px solid var(--hair);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<div class="label">Development · milestone · roadmap</div>
<h1 style="margin: 0; font-size: 24px; line-height: 1.15; letter-spacing: -0.01em; font-weight: 600;">The roadmap</h1>
<div style="display: flex; gap: 16px; color: var(--ink2); font-size: 14px;">
<span><span style="color: var(--ink); font-weight: 500;">8</span> closed</span>
<span><span style="color: var(--ink); font-weight: 500;">1</span> open</span>
<span><span style="color: var(--ink); font-weight: 500;">1</span> planned</span>
<span><span style="color: var(--ink); font-weight: 500;">{{builtCount}}</span> of {{unitTotal}} units built</span>
</div>
</div>
<div style="display: flex; gap: 8px; align-items: center;">
<button class="btn ghost" onClick="{{toggleAll}}">{{allLabel}}</button>
<button class="btn" onClick="{{runSim}}">{{simLabel}}</button>
</div>
</div>

<div style="padding-top: 24px;">
<sc-for list="{{milestones}}" as="m" hint-placeholder-count="10">
<div class="ms">
<div class="{{m.railCls}}"><button class="{{m.dotCls}}" onClick="{{m.toggle}}" aria-label="Fold {{m.ref}}"></button></div>
<div style="padding-bottom: 8px;">
<button class="head" onClick="{{m.toggle}}">
<div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;">
<span class="{{m.chevCls}}">›</span>
<span class="mono" style="color: var(--ink2);">{{m.ref}}</span>
<span style="font-size: 16px; font-weight: 600; line-height: 1.3;">{{m.title}}</span>
<span class="{{m.chipCls}}">{{m.state}}</span>
</div>
<div style="display: flex; align-items: center; gap: 16px; padding: 6px 0 0 22px; flex-wrap: wrap;">
<div class="bar"><sc-for list="{{m.units}}" as="u" hint-placeholder-count="6"><span class="{{u.segCls}}"></span></sc-for></div>
<span style="font-size: 12px; color: var(--ink2);">{{m.counts}}</span>
</div>
<div style="padding: 6px 0 0 22px; color: var(--ink2); max-width: 720px;">{{m.goal}}</div>
</button>
<div class="{{m.foldCls}}"><div>
<div style="padding: 4px 0 12px 10px;">
<sc-for list="{{m.units}}" as="u" hint-placeholder-count="6">
<div class="{{u.rowCls}}">
<span class="{{u.dotCls}}"></span>
<span class="mono" style="color: var(--ink2);">{{u.ref}}</span>
<span class="utitle">{{u.title}}</span>
<span class="{{u.chipCls}}">{{u.stateLabel}}</span>
<span class="mono" style="color: var(--ink2); text-align: right;">{{u.decision}}</span>
<sc-if value="{{u.claimed}}" hint-placeholder-val="{{false}}"><span class="claim slidein">Claimed by a session · started 2026-10-01</span></sc-if>
</div>
</sc-for>
<sc-if value="{{m.empty}}" hint-placeholder-val="{{false}}"><div style="padding: 8px 0; color: var(--ink2); font-size: 13px; border-top: 1px solid var(--hair);">No units of its own — {{m.goal}}</div></sc-if>
</div>
</div></div>
</div>
</div>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":1640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: { M27: true, M28: true }, sim: 0, pulse: 0 };
    this.timers = [];
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  data() {
    const U = (ref, title, state, decision) => ({ ref, title, state, decision: decision || '' });
    return [
      { ref: 'M19', title: 'The engine, built beside the app', state: 'closed', goal: 'A format can be declared and compiles to a real table with real types and checks, beside the ledger and touching none of it.', units: [
        U('M19 U1','a format can be authored, and compiles to a real table','built','D-216'), U('M19 U1a','the four reading vocabularies are rows in the document','built','D-212'), U('M19 U1b','a role can be added, and every check reads the document','built','D-213'), U('M19 U2','the plugin’s tools are generated from the declaration','built','D-217'), U('M19 U2a','a format is edited in a form','built','D-219'), U('M19 U2b','a format is declared from the conversation','built','D-220'), U('M19 U2c','an example infers the columns','built','D-221'), U('M19 U3','identities','built','D-222'), U('M19 U4a','the engine owns dimension and conversion','built','D-223'), U('M19 U4b','links, and the aggregate across one','built','D-224'), U('M19 U4c','a quantity, and the bridge across a dimension','built','D-225'), U('M19 U5','intake targets a declared format','built','D-226') ] },
      { ref: 'M20', title: 'The engine’s own surface', state: 'closed', goal: 'Anything a person can do on a screen a conversation can do too. Its tail was stopped after T1 and T4.', units: [
        U('M20 U0','the pack is staged, and the rail is the engine’s','built','D-228'), U('M20 U1','a format is a tab, and its rows are on it','built','D-229'), U('M20 U2','three doors, and the placeholder stops being pasta','built','D-230'), U('M20 U3','the types have icons, and a vocabulary to go with them','built','D-231'), U('M20 U4','what has to add up, as a picture','built','D-232'), U('M20 U5','Connections — the graph across formats','built','D-233'), U('M20 U6','every surface has a tool, and the audit proves it','built','D-234'), U('M20 U7','intake has a tool half, and it is the pack’s reader generalized','built','D-235'), U('M20 T1','declaring by hand is a walk, not a wall','built','D-237'), U('M20 T4','an identity is not an equation','built','D-236'), U('M20 T9','the app says less — now a standing bar','dropped','') ] },
      { ref: 'M21', title: 'What a model may read, and what it may write', state: 'closed', goal: 'Dissolved by D-249: its tools landed in M24 and its permission screen in M26.', units: [] },
      { ref: 'M22', title: 'The memory dogfood', state: 'closed', goal: 'The project’s list-shaped notes become rows in docs/memory.emd, answerable in one call.', units: [
        U('M22 U2','the migration, and only the list-shaped notes','built',''), U('M22 U3','the gap list, written down as it is found','built',''), U('M22 U4','a document serializes to text, both ways','built','D-245'), U('M22 U5','the easy path is the typed one','built','D-246'), U('M22 U6','a document may be text, and the choice is per file','built','D-247') ] },
      { ref: 'M23', title: 'Two doors, and the row view is a spreadsheet', state: 'closed', goal: 'Closed short: U2, a blank sheet, built; U1 and U3 moved to M26.', units: [
        U('M23 U2','a blank sheet: name the columns, type the rows','built','D-248') ] },
      { ref: 'M24', title: 'What the ledger needs from the engine, as tools', state: 'closed', goal: 'The engine owes the ledger no tool: every gap the survey found has a unit behind it.', units: [
        U('M24 U0','parity becomes lopsided','built','D-249'), U('M24 U1','the survey: every ledger table','built','D-252'), U('M24 U2','a tool makes a connection','built','D-253'), U('M24 U3','add a column and take a format away','built','D-254'), U('M24 U4','a unique column','built','D-255'), U('M24 U5','a link written by its target’s name','built','D-256'), U('M24 U6','fixed-point, month and instant types','built','D-257'), U('M24 U7','row constraints','built','D-259'), U('M24 U8','an aggregate over only the rows that match','built','D-260'), U('M24 U9','a file column fills a link','built','D-261'), U('M24 U10','a reading writes its own header row','built','D-262'), U('M24 U11','removing a linked row names what dangles','built','D-263'), U('M24 U12','a pack’s seeded rows','built','D-264') ] },
      { ref: 'M25', title: 'The engine eats the pack', state: 'closed', goal: 'Done when the ledger is nothing but declared formats, identities and links.', units: [
        U('M25 U0','the plan: a pack may carry code','built','D-265'), U('M25 U1','the ledger is a pack','built','D-266'), U('M25 E1','unique across several columns','built','D-270'), U('M25 E2','a rollup by period','built','D-271'), U('M25 E3','the latest by an order','built','D-272'), U('M25 E4','a matching rule','built','D-273'), U('M25 E5','a pack owns its formats','built','D-274'), U('M25 U2','the reference tables move first','built','D-268'), U('M25 U3','transactions and statements move','built','D-275'), U('M25 U3b','intake moves onto format_intake','built','D-277'), U('M25 U4','holdings, investments and FX move','built','D-278'), U('M25 U5','savings, debts and purchase plans move','built','D-279'), U('M25 U6','funds move, and the first identity','built','D-280'), U('M25 U7','paychecks, splitting and fixed expenses move','built','D-281'), U('M25 U8','the finish line, and the pack at the front door','built','D-282') ] },
      { ref: 'M26', title: 'UI and UX for the engine and the packs', state: 'closed', goal: 'The engine’s screens are the sheet, the canvas, readers, entry pages and the MCP screen.', units: [
        U('M26 U1','the design language, on the formats list alone','built','D-288'), U('M26 U2','a format’s page is a sheet','built','D-289'), U('M26 U3','the format is edited on its sheet','built','D-290'), U('M26 U4','the graph is a canvas','built','D-291'), U('M26 U5','readers, and bulk reading','built','D-292'), U('M26 U6','an entry is a view the format has','built','D-294'), U('M26 U7','an MCP screen','built','D-295'), U('M26 F1','what U5 left undone with readers','built','D-293'), U('M26 F2','an entry page is headings over inputs','built','D-296'), U('M26 F3','a column’s type can be changed in the picker','built',''), U('M23 U1','describe it in text, a local model infers the columns','dropped','D-249'), U('M23 U3','the row view is a spreadsheet','dropped','D-249') ] },
      { ref: 'M27', title: 'The development pack, the first pack after the ledger', state: 'open', goal: 'docs/memory.emd’s formats become the development pack, with a milestone format and views the engine draws.', units: [
        U('M27 U1','the development pack, and a milestone format','built','D-299'), U('M27 U2','a link can name several rows','built','D-300'), U('M27 U3','a view is a row the pack declares; a board','built','D-301'), U('M27 U4','the roadmap and the decision page','built','D-302'), U('M27 U5','a ready view, and one call for start-here','built','D-303'), U('M27 U6','the roadmap tracks a session live','built','D-304'), U('M27 U7','the development pack is a pack, the way the ledger is','planned',''), U('M27 U8','the views get a design: a timeline, motion, one theme','planned','') ] },
      { ref: 'M28', title: 'The ledger’s second pass', state: 'planned', goal: 'Investments leave the ledger whole, and money moved to something you own stops counting as spent.', units: [
        U('M28 U1','investments leave the ledger whole','planned','D-283'), U('M28 U2','money moved to something you own is not spent','planned','D-283'), U('M28 U3','payslips are read in bulk','planned','D-292') ] }
    ];
  }
  runSim() {
    this.timers.forEach(clearTimeout);
    if (this.state.sim === 2) { this.setState({ sim: 0, pulse: 0 }); return; }
    const open = Object.assign({}, this.state.open, { M27: true });
    this.setState({ sim: 1, pulse: this.state.pulse + 1, open });
    this.timers = [setTimeout(() => this.setState({ sim: 2, pulse: this.state.pulse + 1 }), 2600)];
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const ms = this.data();
    const sim = this.state.sim;
    const openIndex = ms.findIndex((m) => m.state === 'open');
    let built = 0;
    const milestones = ms.map((m, i) => {
      const on = !!this.state.open[m.ref];
      const units = m.units.map((u) => {
        let state = u.state;
        const isTarget = u.ref === 'M27 U7';
        if (isTarget && sim === 1) state = 'in_progress';
        if (isTarget && sim === 2) state = 'built';
        if (state === 'built') built++;
        const pulse = isTarget && sim > 0 ? (this.state.pulse % 2 ? ' pulseA' : ' pulseB') : '';
        const flash = isTarget && sim > 0 ? ' flash' : '';
        return { ref: u.ref, title: u.title, decision: isTarget && sim === 2 ? 'D-305' : u.decision,
          stateLabel: state.replace('_', ' '), chipCls: 'chip ' + state, dotCls: 'udot ' + state, segCls: 'seg ' + state,
          rowCls: 'unit ' + state + pulse + flash, claimed: isTarget && sim === 1 };
      });
      const n = (s) => units.filter((u) => u.segCls === 'seg ' + s).length;
      const parts = [];
      if (n('built')) parts.push(n('built') + ' built');
      if (n('in_progress')) parts.push(n('in_progress') + ' in progress');
      if (n('planned')) parts.push(n('planned') + ' planned');
      if (n('dropped')) parts.push(n('dropped') + ' dropped');
      let rail = 'rail';
      if (i === 0) rail += ' first';
      if (i === ms.length - 1) rail += ' last';
      if (i >= openIndex) rail += (i === ms.length - 1 ? ' lastdash' : ' dashed');
      return { ref: m.ref, title: m.title, goal: m.goal, state: m.state, units, empty: units.length === 0,
        counts: units.length ? parts.join(' · ') : 'no units',
        railCls: rail, dotCls: 'dot ' + m.state, chipCls: 'chip ' + m.state,
        foldCls: on ? 'fold on' : 'fold', chevCls: on ? 'chev on' : 'chev',
        toggle: () => this.setState({ open: Object.assign({}, this.state.open, { [m.ref]: !on }) }) };
    });
    const allOpen = ms.every((m) => this.state.open[m.ref]);
    return {
      rootClass: dark ? 'em dark' : 'em',
      milestones,
      builtCount: built,
      unitTotal: ms.reduce((t, m) => t + m.units.length, 0),
      allLabel: allOpen ? 'Fold all' : 'Unfold all',
      toggleAll: () => { const o = {}; ms.forEach((m) => { o[m.ref] = !allOpen; }); this.setState({ open: o }); },
      simLabel: sim === 0 ? 'Watch a session take M27 U7' : sim === 1 ? 'A session is working…' : 'Reset',
      runSim: () => this.runSim()
    };
  }
}
</script>
</body>
</html>
