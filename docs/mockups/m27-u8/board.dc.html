<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Units board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.em{--bg:#ffffff;--surface:#f7f7f6;--elevated:#ffffff;--ink:#111111;--ink2:#6b6b6b;--ink3:#a0a09c;--hair:#ececea;--hair2:#d9d9d6;--accent:#07805f;--accent-ink:#ffffff;--accent-soft:#e8f6f1;--pop:0 1px 2px rgba(17,17,17,.04),0 8px 24px rgba(17,17,17,.08);--ease:cubic-bezier(.22,1,.36,1);background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background-color 180ms,color 180ms}
.em.dark{--bg:#0b0b0c;--surface:#151517;--elevated:#1b1b1e;--ink:#f2f2f0;--ink2:#a1a1a0;--ink3:#6a6a6c;--hair:#262629;--hair2:#34343a;--accent:#34d399;--accent-ink:#06231a;--accent-soft:#10312a;--pop:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.55)}
.em button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.em button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px}
.label{font-size:11px;line-height:1.3;letter-spacing:.08em;font-weight:500;text-transform:uppercase;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1.3;letter-spacing:.06em;font-weight:500;text-transform:uppercase;padding:3px 8px;border:1px solid var(--hair2);color:var(--ink2);white-space:nowrap}
.tab{height:32px;padding:0 12px;border:1px solid var(--hair2)!important;color:var(--ink2)!important;font-size:13px!important;transition:background-color 120ms,color 120ms}
.tab.on{background:var(--ink)!important;color:var(--bg)!important;border-color:var(--ink)!important}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:860px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.lanes{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.lanehead{display:flex;align-items:center;gap:8px;padding:2px 2px 6px}
.ldot{width:10px;height:10px;border-radius:9999px;border:2px solid var(--hair2);box-sizing:border-box}
.ldot.built{background:var(--ink);border-color:var(--ink)}
.ldot.in_progress{background:var(--accent);border-color:var(--accent)}
.ldot.dropped{border-style:dashed}
.card{background:var(--elevated);border:1px solid var(--hair);padding:12px;display:flex;flex-direction:column;gap:8px;transition:border-color 120ms,box-shadow 180ms}
.card:hover{border-color:var(--hair2);box-shadow:var(--pop)}
.card.in_progress{border-left:0;box-shadow:inset 2px 0 0 var(--accent)}
.card.dropped .ctitle{text-decoration:line-through;color:var(--ink2)}
.landA{animation:landA 320ms var(--ease) 1}
.landB{animation:landB 320ms var(--ease) 1}
@keyframes landA{from{opacity:0;transform:translateX(var(--from,-24px))}to{opacity:1;transform:none}}
@keyframes landB{from{opacity:0;transform:translateX(var(--from,-24px))}to{opacity:1;transform:none}}
.fromR{--from:24px}
.mv{width:28px;height:28px;display:inline-flex!important;align-items:center;justify-content:center;color:var(--ink2)!important;border:1px solid transparent!important;transition:border-color 120ms,color 120ms}
.mv:hover{border-color:var(--hair2)!important;color:var(--ink)!important}
.mv:disabled{opacity:.3;cursor:default}
.empty{border:1px dashed var(--hair2);color:var(--ink2);font-size:13px;padding:16px 12px;text-align:center}
@media (prefers-reduced-motion: reduce){.em *,.em *::before,.em *::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="{{rootClass}}">
<div style="max-width: 1200px; margin: 0 auto; padding: 48px 32px 96px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding-bottom: 24px; border-bottom: 1px solid var(--hair);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<div class="label">Development · unit · board by state</div>
<h1 style="margin: 0; font-size: 24px; line-height: 1.15; letter-spacing: -0.01em; font-weight: 600;">Units</h1>
<div style="color: var(--ink2);">Move a card to change its state. The move is a write, and a session can make it too.</div>
</div>
<div style="display: flex; gap: 0;" role="group" aria-label="Milestone">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3"><button class="{{f.cls}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for>
</div>
</div>

<div class="lanes">
<sc-for list="{{lanes}}" as="l" hint-placeholder-count="4">
<section class="lane" aria-label="{{l.label}}">
<div class="lanehead">
<span class="{{l.dotCls}}"></span>
<span class="label" style="color: var(--ink);">{{l.label}}</span>
<span class="mono" style="color: var(--ink2); margin-left: auto;">{{l.count}}</span>
</div>
<sc-for list="{{l.cards}}" as="c" hint-placeholder-count="3">
<article class="{{c.cls}}">
<div style="display: flex; align-items: center; gap: 8px;">
<span class="mono" style="color: var(--ink2);">{{c.ref}}</span>
<span style="margin-left: auto; display: flex; gap: 2px;">
<button class="mv" onClick="{{c.left}}" disabled="{{c.noLeft}}" aria-label="Move {{c.ref}} left">‹</button>
<button class="mv" onClick="{{c.right}}" disabled="{{c.noRight}}" aria-label="Move {{c.ref}} right">›</button>
</span>
</div>
<div class="ctitle" style="font-weight: 500; line-height: 1.35;">{{c.title}}</div>
<div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
<span class="chip">{{c.milestone}}</span>
<sc-if value="{{c.hasDecision}}" hint-placeholder-val="{{true}}"><span class="mono" style="color: var(--ink2);">{{c.decision}}</span></sc-if>
</div>
</article>
</sc-for>
<sc-if value="{{l.isEmpty}}" hint-placeholder-val="{{false}}"><div class="empty">Nothing {{l.label}}</div></sc-if>
</section>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const U = (ref, milestone, title, state, decision) => ({ ref, milestone, title, state, decision: decision || '' });
    this.state = { filter: 'M27', moved: null, tick: 0, dir: 1, units: [
      U('M26 U6','M26','an entry is a view the format has','built','D-294'),
      U('M26 U7','M26','an MCP screen','built','D-295'),
      U('M23 U1','M26','describe it in text, a local model infers the columns','dropped','D-249'),
      U('M23 U3','M26','the row view is a spreadsheet','dropped','D-249'),
      U('M27 U1','M27','the development pack, and a milestone format','built','D-299'),
      U('M27 U2','M27','a link can name several rows','built','D-300'),
      U('M27 U3','M27','a view is a row the pack declares, and the first one is a board','built','D-301'),
      U('M27 U4','M27','the roadmap and the decision page','built','D-302'),
      U('M27 U5','M27','a ready view, and one call that answers start-here','built','D-303'),
      U('M27 U6','M27','the roadmap tracks a session live','built','D-304'),
      U('M27 U7','M27','the development pack is a pack, the way the ledger is','planned',''),
      U('M27 U8','M27','the views get a design: a timeline roadmap, motion that explains, one theme','planned',''),
      U('M28 U1','M28','investments leave the ledger whole','planned','D-283'),
      U('M28 U2','M28','money moved to something you own is not spent','planned','D-283'),
      U('M28 U3','M28','payslips are read in bulk','planned','D-292')
    ] };
  }
  move(ref, step) {
    const order = ['planned', 'in_progress', 'built', 'dropped'];
    const units = this.state.units.map((u) => {
      if (u.ref !== ref) return u;
      const i = Math.min(order.length - 1, Math.max(0, order.indexOf(u.state) + step));
      return Object.assign({}, u, { state: order[i] });
    });
    this.setState({ units, moved: ref, tick: this.state.tick + 1, dir: step });
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const order = [['planned', 'Planned'], ['in_progress', 'In progress'], ['built', 'Built'], ['dropped', 'Dropped']];
    const f = this.state.filter;
    const shown = this.state.units.filter((u) => f === 'all' || u.milestone === f);
    const lanes = order.map(([key, label], li) => {
      const cards = shown.filter((u) => u.state === key).map((u) => {
        let cls = 'card ' + u.state;
        if (u.ref === this.state.moved) cls += (this.state.tick % 2 ? ' landA' : ' landB') + (this.state.dir < 0 ? ' fromR' : '');
        return { ref: u.ref, title: u.title, milestone: u.milestone, decision: u.decision, hasDecision: !!u.decision, cls,
          noLeft: li === 0, noRight: li === order.length - 1,
          left: () => this.move(u.ref, -1), right: () => this.move(u.ref, 1) };
      });
      return { label, dotCls: 'ldot ' + key, cards, count: String(cards.length), isEmpty: cards.length === 0 };
    });
    const filters = [['M27', 'M27'], ['M28', 'M28'], ['all', 'M26 – M28']].map(([key, label]) => ({
      label, cls: f === key ? 'tab on' : 'tab', pick: () => this.setState({ filter: key, moved: null }) }));
    return { rootClass: dark ? 'em dark' : 'em', lanes, filters };
  }
}
</script>
</body>
</html>
